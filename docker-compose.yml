
services:
  mongo:
    image: mongo:8
    container_name: gitops-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: gitops-api
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/gitops_db

    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
    external: true
    name: gitops-mongo-data
